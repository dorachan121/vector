# ルールエンジン (Vector.Core) を Unity なしで検証する。
# Unity のライセンスが不要なので、プッシュごとに数十秒で回る。
name: Core

on:
  push:
    branches: [master]
    paths:
      - "Assets/Vector/Scripts/Core/**"
      - "Assets/Vector/Tests/**"
      - "Tools/**"
      - ".editorconfig"
      - ".github/workflows/core.yml"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      # ビルドで .editorconfig の解析（不要な using・使われていないメンバー）も検査する
      - name: Unit tests
        run: dotnet test Tools/CoreTests -c Release
      - name: Build simulator
        run: dotnet build Tools/Simulator -c Release
      # 厳密に計算できるゲームは RTP を出力し、そうでないものは短いシミュレーションで動作を確かめる
      - name: VECTOR bonus bet RTP (exact)
        run: dotnet run --project Tools/Simulator -c Release --no-build -- bonus
      - name: VECTOR smoke simulation
        run: dotnet run --project Tools/Simulator -c Release --no-build -- main 2000 greedy
      - name: CROWN DICE RTP (exact) and simulation
        run: dotnet run --project Tools/Simulator -c Release --no-build -- crown 20000
      - name: COLOSSEUM RTP (exact) and simulation
        run: dotnet run --project Tools/Simulator -c Release --no-build -- colosseum 20000
      - name: DERBY odds (exact) and simulation
        run: dotnet run --project Tools/Simulator -c Release --no-build -- derby 2000
      - name: DELVE RTP (exact) and simulation
        run: dotnet run --project Tools/Simulator -c Release --no-build -- delve 200000
      - name: ORBIT RTP (exact) and simulation
        run: dotnet run --project Tools/Simulator -c Release --no-build -- orbit 200000
      - name: HARPOON RTP (exact) and simulation
        run: dotnet run --project Tools/Simulator -c Release --no-build -- harpoon 200000
      - name: ALCHEMIA smoke simulation
        run: dotnet run --project Tools/Simulator -c Release --no-build -- alchemia 200000
      - name: Story mode challenge balance
        run: dotnet run --project Tools/Simulator -c Release --no-build -- challenge 200
